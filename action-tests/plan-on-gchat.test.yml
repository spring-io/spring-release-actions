name: plan-on-gchat
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start GChat server
        uses: ./__fixtures__/gchat-server

      - name: Plan release
        uses: ./plan-on-gchat
        with:
          gchat-webhook-url: ${{ env.GCHAT_WEBHOOK_URL }}
          version: "1.2.4"
          version-date: "2025-06-01"
          project-name: spring-boot
