name: propose-release-blog-post
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start GitHub server
        uses: ./__fixtures__/github-server
        with:
          port: "18085"
          milestones: >-
            [
              {"number": 1, "title": "4.0.8", "state": "closed", "due_on": "2026-08-05T00:00:00Z", "description": ""},
              {"number": 2, "title": "4.1.1", "state": "closed", "due_on": "2026-08-20T00:00:00Z", "description": ""},
              {"number": 3, "title": "4.2.0", "state": "closed", "due_on": "2026-09-01T00:00:00Z", "description": ""}
            ]
          branches: >-
            {"heads/main": "base-sha", "tags/v4.0.8": "tag-sha-1", "tags/4.1.1": "tag-sha-2"}

      - name: Propose blog post
        uses: ./propose-release-blog-post
        with:
          repository: owner/spring-boot
          project-name: spring-boot
          year: "2026"
          month: "8"
          author: octocat
          website-token: ${{ secrets.GITHUB_TOKEN }}
          website-repository: spring-io/spring-website-content

      - name: Propose blog post again
        uses: ./propose-release-blog-post
        with:
          repository: owner/spring-boot
          project-name: spring-boot
          year: "2026"
          month: "8"
          author: octocat
          website-token: ${{ secrets.GITHUB_TOKEN }}
          website-repository: spring-io/spring-website-content
