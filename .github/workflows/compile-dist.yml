name: Compile dist/

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile-dist:
    name: Compile dist/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Commit updated dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || (git commit -m "Update dist/" && git push)
