name: "Update Learn Page"
description: "Update #learn Page on Spring OSS and Commercial Websites"
author: "jzheaux"

inputs:
  version:
    description: "The current version"
    required: true
  website-token:
    description: "The GitHub token needed to directly edit spring-website-content or spring-website-commercial-content.
      When supplied, the action edits the documentation.json file in the website repository directly (required for commercial repos).
      When omitted, the action uses the Spring Projects REST API (suitable for OSS repos)."
    required: false

  release-channel:
    description: "The release channel underway: 'oss', 'internal', 'lts', or 'hotfix' (see compute-release-channel). Anything but 'oss' selects the commercial website. When omitted, a project name containing 'commercial' selects it"
    required: false
  api-doc-url:
    description: "The URL to the project's JavaDoc; supports {version} and {major.minor} placeholders. Defaults to https://docs.spring.io/{project}/reference/{version}/api/java/index.html if is-antora is true (or https://docs.enterprise.spring.io/{project}/reference/{major.minor}/api/java/index.html for a commercial project), and https://docs.spring.io/{project}/site/docs/{version}/api/ otherwise"
    required: false
  is-antora:
    description: "Whether the reference documentation is Antora-based; defaults to true"
    default: "true"
    required: false
  project-name:
    description: "the project name (for example, spring-security); will use repo name if not provided"
    required: false
  ref-doc-url:
    description: "The URL to the project's reference documentation; supports {version} and {major.minor} placeholders. Defaults to https://docs.spring.io/{project}/reference/{version}/index.html, or https://docs.enterprise.spring.io/{project}/reference/{major.minor}/index.html for a commercial project"
    required: false
  website-repository:
    description: "The Spring Website GitHub repo to edit; defaults to spring-io/spring-website-content, or spring-io/spring-website-commercial-content for a commercial project"
    required: false

runs:
  using: "node24"
  main: "../dist/update-learn-page/main/index.js"
