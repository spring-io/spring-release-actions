name: "publish-release-notes"
description: "An action that publishes the release notes, ensuring the needed tag exists"
author: "jzheaux"

inputs:
  tag:
    description: "The tag to use"
    required: true

  release-notes-location:
    description: "The location of the release notes file; defaults to changelog.md"
    required: false
    default: "changelog.md"

  token:
    description: "The token with permissions to create and delete releases"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Publish Release Notes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
        RELEASE_NOTES_LOCATION: ${{ inputs.release-notes-location }}
        PRERELEASE: ${{ (contains(inputs.tag, '-M') || contains(inputs.tag, '-RC')) && '--prerelease' || '' }}
      run: |
        set +e
        gh release delete $TAG -y
        RELEASE_URL=$(gh release create $TAG -F $RELEASE_NOTES_LOCATION $PRERELEASE --target $GITHUB_SHA)
        echo "::notice title=Release Page::$RELEASE_URL"